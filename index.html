<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator Tasks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }
        .task-container {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            max-width: 600px;
            background-color: #f9f9f9;
        }
        h2 {
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        input[type="number"], select {
            padding: 5px;
            font-size: 16px;
            margin-right: 5px;
            width: 80px;
        }
        input[type="radio"] {
            margin-left: 15px;
        }
        button {
            padding: 6px 12px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            font-weight: bold;
            font-size: 18px;
            margin-left: 15px;
            color: #d9534f;
        }
        .radio-group label {
            margin-right: 15px;
            font-size: 14px;
        }
        .inc-dec-group {
            display: inline-flex;
            align-items: center;
            margin-right: 10px;
        }
        .inc-dec-group button {
            padding: 4px 10px;
            margin: 0 2px;
        }
    </style>
</head>
<body>

    <h1>JavaScript Calculator Tasks</h1>

    <!-- TASK 1 -->
    <div class="task-container">
        <h2>Task 1: Calculator with text box and dropdown list</h2>
        <input type="number" id="num1" value="10">
        
        <select id="operator-1">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>

        <input type="number" id="num2" value="5">
        
        <button onclick="calculateTask1()">=</button>
        
        <span class="result">Press = mark!</span>
        <span id="result1" class="result"></span>
    </div>

    <!-- TASK 2 -->
    <div class="task-container">
        <h2>Task 2: Calculator with text box and option buttons</h2>
        
        <input type="number" id="num3" value="10">
        <br><br>
        
        <div class="radio-group">
            <input type="radio" name="operator-2" id="op-add" value="+" checked>
            <label for="op-add">Addition</label>
            
            <input type="radio" name="operator-2" id="op-sub" value="-">
            <label for="op-sub">Subtraction</label>
            
            <input type="radio" name="operator-2" id="op-mul" value="*">
            <label for="op-mul">Multiplication</label>
            
            <input type="radio" name="operator-2" id="op-div" value="/">
            <label for="op-div">Distribution (Division)</label>
        </div>
        <br>
        
        <input type="number" id="num4" value="5">
        <button onclick="calculateTask2()">=</button>
        <span class="result">Press = mark!</span>
        <span id="result2" class="result"></span>
    </div>

    <!-- TASK 3 -->
    <div class="task-container">
        <h2>Task 3: Calculator with increment/decrement buttons</h2>
        
        <div class="inc-dec-group">
            <button onclick="changeValue('num5', -1)">▼</button>
            <input type="number" id="num5" value="10">
            <button onclick="changeValue('num5', 1)">▲</button>
        </div>

        <select id="operator-3">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>

        <div class="inc-dec-group">
            <button onclick="changeValue('num6', -1)">▼</button>
            <input type="number" id="num6" value="10">
            <button onclick="changeValue('num6', 1)">▲</button>
        </div>

        <button onclick="calculateTask3()">=</button>
        <span class="result">Press = mark!</span>
        <span id="result3" class="result"></span>
    </div>

    <script>
        // --- TASK 1 LOGIC ---
        function calculateTask1() {
            let n1 = parseFloat(document.getElementById('num1').value);
            let n2 = parseFloat(document.getElementById('num2').value);
            let op = document.getElementById('operator-1').value;
            
            let result = performCalculation(n1, n2, op);
            document.getElementById('result1').innerText = result;
        }

        // --- TASK 2 LOGIC ---
        function calculateTask2() {
            let n1 = parseFloat(document.getElementById('num3').value);
            let n2 = parseFloat(document.getElementById('num4').value);
            
            // Get the value of the checked radio button
            let op = document.querySelector('input[name="operator-2"]:checked').value;
            
            let result = performCalculation(n1, n2, op);
            document.getElementById('result2').innerText = result;
        }

        // --- TASK 3 LOGIC ---
        function calculateTask3() {
            let n1 = parseFloat(document.getElementById('num5').value);
            let n2 = parseFloat(document.getElementById('num6').value);
            let op = document.getElementById('operator-3').value;
            
            let result = performCalculation(n1, n2, op);
            document.getElementById('result3').innerText = result;
        }

        // Helper function to increment/decrement values for Task 3
        function changeValue(inputId, amount) {
            let inputElement = document.getElementById(inputId);
            let currentValue = parseFloat(inputElement.value) || 0;
            inputElement.value = currentValue + amount;
        }

        // Shared calculation function to avoid repeating code
        function performCalculation(num1, num2, operator) {
            if (isNaN(num1) || isNaN(num2)) return "Please enter valid numbers";
            
            switch(operator) {
                case '+': return num1 + num2;
                case '-': return num1 - num2;
                case '*': return num1 * num2;
                case '/': 
                    if (num2 === 0) return "Cannot divide by zero";
                    return num1 / num2;
                default: return "Invalid operator";
            }
        }
    </script>

</body>
</html>
